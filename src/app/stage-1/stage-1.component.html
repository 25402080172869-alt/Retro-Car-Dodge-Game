<div class="column-layout road-container-1">
  <p class="ig-typography__overline road-title-1">
    FALTA 3 KM - OBSTÁCULO A LA IZQUIERDA
  </p>
  <div class="row-layout road-grid-1">
    <div class="column-layout left-lane-1">
      <div class="column-layout left-obstacle-space">
        <img src="/assets/red-sport-car-top-view-vector-067c72b9a4bc.png" alt="" class="obstacle-left-image" />
        <igx-badge type="error" value="CAMIÓN LENTO" class="obstacle-left-badge"></igx-badge>
      </div>
      <p class="blank-left-1">
        . . .
      </p>
      <div class="column-layout player-left-slot-1">
        <p class="ig-typography__caption player-left-text-1">
          Libre
        </p>
      </div>
    </div>
    <div class="column-layout center-lane-1">
      <div class="column-layout center-obstacle-space">
        <igx-icon class="center-clear-icon-1">
          expand_more
        </igx-icon>
      </div>
      <p class="blank-left-1">
        . . .
      </p>
      <div class="column-layout left-obstacle-space">
        <igx-badge type="success" value="TÚ" class="obstacle-left-badge"></igx-badge>
        <img src="/assets/yellow-arcade-racer-car-top-vi-cdbd5762194a.png" alt="" class="player-car-image-1" />
      </div>
    </div>
    <div class="column-layout right-lane-1">
      <div class="column-layout center-obstacle-space">
        <igx-icon class="center-clear-icon-1">
          expand_more
        </igx-icon>
      </div>
      <p class="blank-left-1">
        . . .
      </p>
      <div class="column-layout player-left-slot-1">
        <p class="ig-typography__caption player-left-text-1">
          Libre
        </p>
      </div>
    </div>
  </div>
</div>
<div class="column-layout controls-stage-1">
  <div class="row-layout controls-header-1">
    <h5 class="controls-title-1">
      JOYSTICK CONSOLE
    </h5>
    <igx-icon class="center-clear-icon-1">
      videogame_asset
    </igx-icon>
  </div>
  <p class="ig-typography__body-2 blank-left-1">
    Un camión obstaculiza el carril IZQUIERDO. ¡Gira a la DERECHA para esquivarlo!
  </p>
  <div class="column-layout steering-box-1">
    <p class="ig-typography__overline road-title-1">
      DIRECCIÓN DE MARCHA
    </p>
    <div class="row-layout steering-buttons-1">
      <button igxButton="contained" type="button" [routerLink]="[`/crash-view`]" class="girar-izquierda-1">
        <igx-icon class="icon">
          arrow_back
        </igx-icon>
        <span>IZQUIERDA</span>
      </button>
      <button igxButton="contained" type="button" [routerLink]="[`/stage-2`]" class="girar-derecha-1">
        <span>DERECHA</span>
        <igx-icon class="icon_1">
          arrow_forward
        </igx-icon>
      </button>
    </div>
  </div>
</div>
