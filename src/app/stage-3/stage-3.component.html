<div class="column-layout road-container-3">
  <p class="ig-typography__overline road-title-3">
    ÚLTIMO METRO - OBSTÁCULO A LA DERECHA
  </p>
  <div class="row-layout road-grid-3">
    <div class="column-layout left-lane-3">
      <div class="column-layout left-obstacle-space-3">
        <igx-icon class="left-clear-icon-3">
          expand_more
        </igx-icon>
      </div>
      <p class="blank-left-3">
        . . .
      </p>
      <div class="column-layout player-car-left-3">
        <igx-badge type="success" value="TÚ" class="player-badge-3"></igx-badge>
        <img src="/assets/yellow-arcade-racer-car-top-vi-eab381eb6652.png" alt="" class="player-car-image-3" />
      </div>
    </div>
    <div class="column-layout center-lane-3">
      <div class="column-layout left-obstacle-space-3">
        <igx-icon class="left-clear-icon-3">
          expand_more
        </igx-icon>
      </div>
      <p class="blank-left-3">
        . . .
      </p>
      <div class="column-layout player-center-slot-3">
        <p class="ig-typography__caption player-center-text-3">
          Libre
        </p>
      </div>
    </div>
    <div class="column-layout right-lane-3">
      <div class="column-layout player-car-left-3">
        <img src="/assets/blue-sport-car-top-view-vector-9963d3fe1860.png" alt="" class="obstacle-right-image" />
        <igx-badge type="error" value="AUTO DE POLICÍA" class="player-badge-3"></igx-badge>
      </div>
      <p class="blank-left-3">
        . . .
      </p>
      <div class="column-layout player-center-slot-3">
        <p class="ig-typography__caption player-center-text-3">
          Libre
        </p>
      </div>
    </div>
  </div>
</div>
<div class="column-layout controls-stage-3">
  <div class="row-layout controls-header-3">
    <h5 class="controls-title-3">
      JOYSTICK CONSOLE
    </h5>
    <igx-icon class="left-clear-icon-3">
      videogame_asset
    </igx-icon>
  </div>
  <p class="ig-typography__body-2 blank-left-3">
    ¡Última maniobra! Un auto de policía bloquea la DERECHA. ¡Gira a la DERECHA para superarlo por el centro!
  </p>
  <div class="column-layout steering-box-3">
    <p class="ig-typography__overline road-title-3">
      DIRECCIÓN DE MARCHA
    </p>
    <div class="row-layout steering-buttons-3">
      <button igxButton="contained" type="button" [routerLink]="[`/crash-view`]" class="girar-izquierda-3">
        <igx-icon class="icon">
          arrow_back
        </igx-icon>
        <span>IZQUIERDA</span>
      </button>
      <button igxButton="contained" type="button" [routerLink]="[`/victory-view`]" class="girar-derecha-3">
        <span>DERECHA</span>
        <igx-icon class="icon_1">
          arrow_forward
        </igx-icon>
      </button>
    </div>
  </div>
</div>
